name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout labelle-core
        run: git clone --depth 1 --branch main https://github.com/labelle-toolkit/labelle-core.git ../labelle-core

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Run unit tests
        run: zig build test

      - name: Run zspec tests
        run: zig build spec

      - name: Compile controller for wasm32
        run: zig build wasm-check

      # Prepared endpoint integration depends on engine#917 until its release.
      # Pin the exact tested commit rather than following an unreleased branch.
      - name: Checkout engine position revision API
        run: |
          git init ../labelle-engine
          git -C ../labelle-engine remote add origin https://github.com/labelle-toolkit/labelle-engine.git
          git -C ../labelle-engine fetch --depth 1 origin c9dddffba8f78d9e1dbd5a81d34f5623b669a2e5
          git -C ../labelle-engine checkout --detach FETCH_HEAD

      - name: Run engine integration tests
        run: zig build test --build-file tests/integration/build.zig --summary all
